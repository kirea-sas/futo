name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer PyTorch en version processeur
        # Le runner n'a pas de GPU : la roue « +cpu » évite de télécharger
        # 2,5 Go de bibliothèques CUDA pour rien.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Installer Futo
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check futo tests

      - name: Tests
        # Les tests ne doivent RIEN télécharger : ils tournent sur le corpus
        # d'exemple versionné dans le dépôt. Si l'un d'eux se met à demander le
        # réseau, il faut le corriger, pas ouvrir le pare-feu.
        run: pytest -q

      - name: Vérifier que la chaîne complète tourne
        run: |
          futo tokenizer entrainer --corpus 'data/echantillon/*.txt' \
                                   --vocab 2048 --silencieux
          futo data preparer --corpus 'data/echantillon/*.txt' \
                             --fraction-val 0.05 --tokens-par-shard 20000 \
                             --silencieux
          futo train configs/futo-tiny.yaml \
                     --set model.vocab_size=2048 --set train.max_steps=20 \
                     --set train.eval_every=0 --silencieux
          futo eval sorties/tiny/dernier.pt --lots 2
          futo generer sorties/tiny/dernier.pt --amorce "Bonjour" --max-tokens 10
