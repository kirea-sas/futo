name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer PyTorch en version processeur
        # Le runner n'a pas de GPU : la roue « +cpu » évite de télécharger
        # 2,5 Go de bibliothèques CUDA pour rien.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Installer Futo
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check futo tests

      - name: Tests
        # Les tests ne doivent RIEN télécharger : ils tournent sur le corpus
        # d'exemple versionné dans le dépôt. Si l'un d'eux se met à demander le
        # réseau, il faut le corriger, pas ouvrir le pare-feu.
        run: pytest -q

      - name: Chaîne complète
        # AUCUNE commande écrite ici. Tout est dans le script, qui se lance à
        # l'identique en local — c'est la seule façon de ne pas découvrir une
        # faute de frappe après l'avoir poussée. Onze exécutions ont échoué
        # d'affilée pour un « max_steps=20 » incompatible avec « warmup_steps=20 »,
        # écrit directement dans ce fichier et donc jamais exécuté avant.
        run: bash scripts/verifier-chaine.sh
